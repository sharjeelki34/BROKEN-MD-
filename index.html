<script>
async function getPairingCode() {
    const phoneInput = document.getElementById('phoneNumber').value.trim();
    if (!phoneInput) {
        alert("Pehle phone number enter karein!");
        return;
    }

    // Number se '+' ya spaces hata kar sirf digits rakhein
    const cleanNumber = phoneInput.replace(/[^0-9]/g, '');

    const submitBtn = document.getElementById('submitBtn');
    const codeBox = document.getElementById('codeBox');
    const codeResult = document.getElementById('codeResult');

    submitBtn.innerText = "GENERATING...";
    submitBtn.disabled = true;

    try {
        const response = await fetch(`https://5a792558-abc8-4c03-9f69-32ad18429803-00-2vjuh9e2juh1v.janeway.replit.dev/api/pair?number=${cleanNumber}`);
        const data = await response.json();

        if (data.code) {
            codeResult.innerText = data.code;
            codeBox.style.display = 'block';
        } else {
            alert(data.error || "Pairing code generate nahi ho saka. Number check karein!");
        }
    } catch (err) {
        console.error(err);
        alert("Server error! Make sure Replit bot is running.");
    } finally {
        submitBtn.innerText = "GET PAIR CODE";
        submitBtn.disabled = false;
    }
}
</script>
