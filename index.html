<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROKEN-MD WhatsApp Pairing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h2 {
            color: #25D366;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #555;
        }
        .code-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 6px;
            display: none;
        }
        .code-text {
            font-size: 24px;
            font-weight: bold;
            color: #25D366;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>BROKEN-MD BOT</h2>
    <p>Enter your WhatsApp Number with Country Code (e.g. 923001234567)</p>
    
    <input type="text" id="phoneNumber" placeholder="923001234567">
    <button id="submitBtn" onclick="getPairingCode()">GET PAIR CODE</button>

    <div class="code-box" id="codeBox">
        <p style="margin:0 0 8px 0; font-size:14px; color:#aaa;">Your Pairing Code:</p>
        <div class="code-text" id="codeResult">------</div>
    </div>
</div>

<script>
async function getPairingCode() {
    const phoneInput = document.getElementById('phoneNumber').value.trim();
    if (!phoneInput) {
        alert("Pehle phone number enter karein!");
        return;
    }

    const cleanNumber = phoneInput.replace(/[^0-9]/g, '');

    const submitBtn = document.getElementById('submitBtn');
    const codeBox = document.getElementById('codeBox');
    const codeResult = document.getElementById('codeResult');

    submitBtn.innerText = "GENERATING...";
    submitBtn.disabled = true;

    try {
        const response = await fetch(`https://broken-md-pair-2026-aa3c4bae3c4b.herokuapp.com/code?number=${cleanNumber}`);
        const data = await response.json();

        if (data.code) {
            codeResult.innerText = data.code;
            codeBox.style.display = 'block';
        } else {
            alert(data.error || "Pairing code generate nahi ho saka. Number check karein!");
        }
    } catch (err) {
        console.error(err);
        alert("Server error! Make sure Heroku bot is running.");
    } finally {
        submitBtn.innerText = "GET PAIR CODE";
        submitBtn.disabled = false;
    }
}
</script>

</body>
</html>
